# Copy this file to settings.properties and fill in the values.
# settings.properties holds personal data. Do not commit it.
# A -Dkey=value option on the command line replaces a value from the file.

ollama.url=http://localhost:11434
ollama.model=gpt-oss:120b-cloud
calendar.file=calendar.json

profile.name=
profile.surname=
profile.role=
profile.company=
# Sender address of the invitations
profile.email=

# Emails are .eml files in two buckets: <outbox.folder>/drafts and <outbox.folder>/sent. No email leaves the computer.
outbox.folder=outbox

# Optional: write every step between you, the agent and the LLM to this file.
# run-side-by-side.sh sets it for you.
# trace.file=trace.log
